<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3Dアセット 公開ギャラリー</title>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js",
        "three/addons/": "./vendor/jsm/"
      }
    }
  </script>
  <style>
    :root {
      --bg: #0f1117;
      --panel: #171a23;
      --panel-2: #1e2230;
      --border: #2b3144;
      --text: #e6e9f2;
      --muted: #9aa3b8;
      --accent: #5b8cff;
      --accent-2: #3dd598;
      --warn: #f5a623;
      --chip-bg: #232838;
      --chip-active: #3454a8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(15, 17, 23, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 10px 18px;
    }
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      max-width: 1720px;
      margin: 0 auto;
    }
    .brand { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    h1 { margin: 0; font-size: 1.04rem; font-weight: 700; }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
    .tab-link {
      background: var(--panel-2);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
    }
    .tab-link:hover { border-color: var(--accent); color: var(--text); }
    .tab-link.active {
      background: var(--chip-active);
      border-color: var(--accent);
      color: #fff;
    }
    .stats {
      font-size: 0.83rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .stats strong { color: var(--text); }
    .btn {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.82rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
    }
    .btn:hover { border-color: var(--accent); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.secondary { background: #22443a; border-color: var(--accent-2); color: #dffcf0; }
    .btn.warn { background: #4a3512; border-color: var(--warn); color: #ffe3a8; }
    main { max-width: 1720px; margin: 0 auto; padding: 14px 18px 48px; }
    .hidden { display: none !important; }

    .notice-banner {
      background: linear-gradient(135deg, rgba(245, 166, 35, 0.14), rgba(91, 140, 255, 0.10));
      border: 1px solid rgba(245, 166, 35, 0.48);
      border-radius: 12px;
      padding: 12px 15px;
      margin-bottom: 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.83rem;
    }
    .notice-banner strong { color: #ffd479; }

    .filters {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
      display: grid;
      gap: 10px;
    }
    .filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
    .filter-group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .filter-label { font-size: 0.78rem; color: var(--muted); font-weight: 600; min-width: 52px; }
    .chip {
      border: 1px solid var(--border);
      background: var(--chip-bg);
      color: var(--text);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      user-select: none;
    }
    .chip:hover { border-color: var(--accent); }
    .chip.active { background: var(--chip-active); border-color: var(--accent); color: #fff; font-weight: 600; }
    select, input[type="search"] {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.84rem;
      outline: none;
    }
    input[type="search"] { min-width: 220px; flex: 1; max-width: 380px; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 0.86rem;
    }
    .pager { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.12s ease, border-color 0.12s ease;
    }
    .card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .thumb-wrap {
      position: relative;
      aspect-ratio: 9 / 14;
      background: #222633;
      cursor: pointer;
      overflow: hidden;
    }
    .thumb-wrap.square { aspect-ratio: 1 / 1; }
    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.2s ease;
    }
    .thumb-wrap.face-zoom img {
      object-position: 50% 10%;
      transform: scale(2.05);
      transform-origin: 50% 14%;
    }
    .thumb-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.84rem;
      padding: 12px;
      text-align: center;
    }
    .status-pill {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(15, 17, 23, 0.86);
      border: 1px solid var(--accent-2);
      color: var(--accent-2);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .lic-pill {
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(15, 17, 23, 0.88);
    }
    .lic-noncommercial_research { border: 1px solid #f5a623; color: #ffe09b; }
    .lic-ai_generated_restricted { border: 1px solid #7aa8ff; color: #c7dbff; }
    .lic-blender_code { border: 1px solid #3dd598; color: #b5ffe1; }

    .dl-overlay {
      position: absolute;
      inset: auto 0 0 0;
      padding: 8px 10px;
      background: linear-gradient(transparent, rgba(10, 12, 18, 0.92));
      display: flex;
      justify-content: space-between;
      align-items: center;
      opacity: 0;
      transition: opacity 0.14s ease;
      font-size: 0.78rem;
    }
    .thumb-wrap:hover .dl-overlay { opacity: 1; }
    .card-body { padding: 10px 11px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .card-title { font-size: 0.86rem; font-weight: 700; word-break: break-word; }
    .meta-tags { display: flex; flex-wrap: wrap; gap: 4px; }
    .tag {
      font-size: 0.7rem;
      color: var(--muted);
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 1px 6px;
    }
    .tag.hi { color: #b7ccff; border-color: #3a528a; }
    .card-actions { margin-top: auto; display: flex; gap: 6px; padding-top: 4px; flex-wrap: wrap; }
    .card-actions .btn { flex: 1; justify-content: center; padding: 5px 8px; font-size: 0.78rem; }

    dialog {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      max-width: 1120px;
      width: 94vw;
      padding: 0;
    }
    dialog::backdrop { background: rgba(5, 7, 11, 0.78); }
    .modal-body {
      display: grid;
      grid-template-columns: minmax(320px, 500px) 1fr;
      gap: 18px;
      padding: 18px;
    }
    @media (max-width: 820px) { .modal-body { grid-template-columns: 1fr; } }
    .viewer-controls, .viewer-motion-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
      align-items: center;
    }
    .viewer-motion-label { font-size: 0.76rem; color: var(--muted); font-weight: 700; margin-right: 2px; }
    .viewer-motion-sep { width: 1px; height: 18px; background: var(--border); margin: 0 2px; }
    .viewer-box {
      position: relative;
      width: 100%;
      height: 440px;
      background: radial-gradient(circle at 50% 35%, #2b3144 0%, #171a23 75%);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .viewer-status {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.85rem;
      pointer-events: none;
      background: rgba(15, 17, 23, 0.55);
    }
    .modal-thumbs { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
    .modal-thumbs a { text-decoration: none; color: var(--muted); font-size: 0.72rem; text-align: center; }
    .modal-thumbs img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 3px;
    }
    .modal-info h2 { margin: 0 0 8px; font-size: 1.05rem; word-break: break-word; }
    .modal-prompt {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.82rem;
      color: var(--text);
      margin: 10px 0 12px;
      white-space: pre-wrap;
    }
    .kv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin: 10px 0; }
    .kv-item { background: var(--panel-2); border: 1px solid var(--border); border-radius: 7px; padding: 6px 8px; font-size: 0.76rem; }
    .kv-item .k { color: var(--muted); font-size: 0.7rem; }
    .kv-item .v { font-weight: 700; }
    .notice-modal-body { padding: 18px 20px; display: grid; gap: 12px; max-height: 84vh; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { border-bottom: 1px solid var(--border); padding: 7px 8px; text-align: left; vertical-align: top; }
    th { color: var(--muted); font-size: 0.74rem; background: var(--panel-2); }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div class="brand">
        <h1 id="site-title">3Dアセット 公開ギャラリー</h1>
        <nav class="tabs" id="repo-nav" aria-label="公開リポジトリ切替"></nav>
      </div>
      <div class="stats">
        <span id="stat-summary">読み込み中...</span>
        <button class="btn warn" id="btn-notices" type="button">利用OSS・非商用注意事項</button>
      </div>
    </div>
  </header>

  <main>
    <section class="notice-banner" id="notice-banner">
      <div>
        <strong>⚠️ 非商用・個人検証/研究用途限定:</strong>
        本ギャラリーの AI 生成 3D モデルは、RigAnything（Adobe Research License・非商用研究限定）および Krea 2 / DINOv3 / Idol3D 等の規約制約を受けます。
      </div>
      <button class="btn warn" id="btn-notices-banner" type="button">OSS・ライセンス詳細を見る</button>
    </section>

    <section class="filters" aria-label="カテゴリ・属性フィルター">
      <div class="filter-row">
        <div class="filter-group" id="fg-category"><span class="filter-label">カテゴリ</span></div>
      </div>
      <div class="filter-row hidden" id="row-sub-filters">
        <div class="filter-group" id="fg-subcategory"><span class="filter-label">種別</span></div>
        <div class="filter-group hidden" id="fg-attrs"><span class="filter-label">属性</span></div>
      </div>
      <div class="filter-row">
        <input id="inp-search" type="search" placeholder="キーワード検索 (名前 / プロンプト / 属性...)" />
        <div class="filter-group">
          <span class="filter-label">並び</span>
          <select id="sel-sort">
            <option value="newest" selected>新しく採用した順</option>
            <option value="id_asc">名前順</option>
            <option value="height_desc">背が高い順</option>
            <option value="height_asc">背が低い順</option>
          </select>
        </div>
        <div class="filter-group" id="vmode-group">
          <span class="filter-label">表示</span>
          <button class="chip active" data-vmode="orig" type="button">元2D</button>
          <button class="chip" data-vmode="render" type="button">3Dカラー</button>
          <button class="chip" data-vmode="clay" type="button">クレイ形状</button>
          <button class="chip" id="btn-face-toggle" type="button">顔アップ</button>
        </div>
        <button class="btn" id="btn-reset" type="button">条件リセット</button>
      </div>
    </section>

    <div class="toolbar">
      <div id="match-count">0件表示</div>
      <div class="pager">
        <label>表示件数:
          <select id="sel-pagesize">
            <option value="60">60</option>
            <option value="120" selected>120</option>
            <option value="300">300</option>
            <option value="9999">全件</option>
          </select>
        </label>
        <button class="btn" id="btn-prev" type="button">前へ</button>
        <span id="page-info">1 / 1</span>
        <button class="btn" id="btn-next" type="button">次へ</button>
      </div>
    </div>

    <section class="grid" id="grid"></section>
  </main>

  <dialog id="detail-dialog">
    <div class="modal-body" id="modal-body"></div>
  </dialog>

  <dialog id="notices-dialog">
    <div class="notice-modal-body" id="notices-modal-body"></div>
  </dialog>

  <script type="module" src="./viewer3d.mjs"></script>
  <script>
    let catalog = { items: [], categories: [], subcategories: {}, attrs: {}, stats: {}, sibling_repos: [] };
    let notices = { summary: [], components: [], tiers: {} };
    let selectedCategory = "all";
    let selectedSub = new Set();
    let selectedAttr = new Set();
    let viewBase = "orig";
    let faceZoom = false;
    let currentPage = 1;

    function fmtSize(bytes) {
      if (!bytes) return "-";
      if (bytes >= 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + " MB";
      return Math.round(bytes / 1024) + " KB";
    }

    function openNoticesModal() {
      const dlg = document.getElementById("notices-dialog");
      const body = document.getElementById("notices-modal-body");
      body.innerHTML = "";

      const head = document.createElement("div");
      head.style.cssText = "display:flex;justify-content:space-between;align-items:center;gap:10px;";
      const h2 = document.createElement("h2");
      h2.style.margin = "0";
      h2.textContent = notices.title || "利用OSS・非商用ライセンス注意事項";
      const closeBtn = document.createElement("button");
      closeBtn.type = "button";
      closeBtn.className = "btn";
      closeBtn.textContent = "閉じる";
      closeBtn.addEventListener("click", () => dlg.close());
      head.appendChild(h2);
      head.appendChild(closeBtn);
      body.appendChild(head);

      const ul = document.createElement("ul");
      ul.style.cssText = "margin:0;padding-left:20px;display:grid;gap:6px;font-size:0.84rem;";
      for (const s of (notices.summary || [])) {
        const li = document.createElement("li");
        li.textContent = s;
        ul.appendChild(li);
      }
      body.appendChild(ul);

      const tbl = document.createElement("table");
      const thead = document.createElement("thead");
      thead.innerHTML = "<tr><th>コンポーネント</th><th>役割</th><th>ライセンス</th><th>注意事項</th></tr>";
      tbl.appendChild(thead);
      const tbody = document.createElement("tbody");
      for (const c of (notices.components || [])) {
        const tr = document.createElement("tr");
        const td1 = document.createElement("td");
        const a = document.createElement("a");
        a.href = c.url || "#";
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.style.color = "#8fb3ff";
        a.textContent = c.name || "";
        td1.appendChild(a);
        const td2 = document.createElement("td");
        td2.textContent = c.role || "";
        const td3 = document.createElement("td");
        td3.textContent = c.license || "";
        const td4 = document.createElement("td");
        td4.textContent = c.commercial_note || "";
        tr.appendChild(td1);
        tr.appendChild(td2);
        tr.appendChild(td3);
        tr.appendChild(td4);
        tbody.appendChild(tr);
      }
      tbl.appendChild(tbody);
      body.appendChild(tbl);
      dlg.showModal();
    }

    function renderRepoNav() {
      const nav = document.getElementById("repo-nav");
      nav.innerHTML = "";
      const isLocalPreview = catalog.repo_key && location.pathname.includes("pages/" + catalog.repo_key);
      for (const s of (catalog.sibling_repos || [])) {
        const a = document.createElement("a");
        a.className = "tab-link" + (s.key === catalog.repo_key ? " active" : "");
        a.href = isLocalPreview ? `../${s.key}/` : s.pages_url;
        a.textContent = s.label;
        nav.appendChild(a);
      }
    }

    function renderFilters() {
      const fgCat = document.getElementById("fg-category");
      const lbl = fgCat.querySelector(".filter-label");
      fgCat.innerHTML = "";
      fgCat.appendChild(lbl);

      const allBtn = document.createElement("button");
      allBtn.type = "button";
      allBtn.className = "chip" + (selectedCategory === "all" ? " active" : "");
      allBtn.textContent = `すべて (${(catalog.stats && catalog.stats.total) || 0})`;
      allBtn.addEventListener("click", () => {
        selectedCategory = "all";
        selectedSub.clear();
        selectedAttr.clear();
        currentPage = 1;
        renderFilters();
        renderGrid();
      });
      fgCat.appendChild(allBtn);

      for (const c of (catalog.categories || [])) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "chip" + (selectedCategory === c.id ? " active" : "");
        b.textContent = `${c.label} (${c.total})`;
        b.addEventListener("click", () => {
          selectedCategory = c.id;
          selectedSub.clear();
          selectedAttr.clear();
          currentPage = 1;
          renderFilters();
          renderGrid();
        });
        fgCat.appendChild(b);
      }

      const subList = selectedCategory === "all" ? [] : ((catalog.subcategories || {})[selectedCategory] || []);
      const attrList = selectedCategory === "all" ? [] : ((catalog.attrs || {})[selectedCategory] || []);

      const fillSet = (domId, list, setObj) => {
        const host = document.getElementById(domId);
        const lb = host.querySelector(".filter-label");
        host.innerHTML = "";
        host.appendChild(lb);
        for (const val of list) {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "chip" + (setObj.has(val) ? " active" : "");
          b.textContent = val;
          b.addEventListener("click", () => {
            if (setObj.has(val)) setObj.delete(val);
            else setObj.add(val);
            b.classList.toggle("active");
            currentPage = 1;
            renderGrid();
          });
          host.appendChild(b);
        }
      };
      fillSet("fg-subcategory", subList, selectedSub);
      fillSet("fg-attrs", attrList, selectedAttr);
      document.getElementById("fg-attrs").classList.toggle("hidden", attrList.length === 0);
      document.getElementById("row-sub-filters").classList.toggle("hidden", subList.length === 0 && attrList.length === 0);
    }

    function filteredItems() {
      const q = document.getElementById("inp-search").value.trim().toLowerCase();
      const sort = document.getElementById("sel-sort").value;
      const list = (catalog.items || []).filter((it) => {
        if (selectedCategory !== "all" && it.category !== selectedCategory) return false;
        if (selectedSub.size && !selectedSub.has(it.subcategory)) return false;
        if (selectedAttr.size && !(it.attrs || []).some((a) => selectedAttr.has(a))) return false;
        if (q) {
          const hay = `${it.id} ${it.category_label || ""} ${it.subcategory || ""} ${(it.attrs || []).join(" ")} ${it.prompt || ""} ${it.note || ""}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      }).slice();

      if (sort === "newest") list.sort((a, b) => (b.published_at || "").localeCompare(a.published_at || "") || (a.id || "").localeCompare(b.id || ""));
      else if (sort === "height_desc") list.sort((a, b) => (b.height_m || 0) - (a.height_m || 0));
      else if (sort === "height_asc") list.sort((a, b) => (a.height_m || 0) - (b.height_m || 0));
      else list.sort((a, b) => (a.id || "").localeCompare(b.id || ""));
      return list;
    }

    function openDetail(item) {
      const dlg = document.getElementById("detail-dialog");
      const body = document.getElementById("modal-body");
      body.innerHTML = "";

      const leftCol = document.createElement("div");
      const viewerHost = document.createElement("div");
      leftCol.appendChild(viewerHost);
      requestAnimationFrame(() => {
        if (window.mountGlbViewer) window.mountGlbViewer(viewerHost, "./" + encodeURI(item.model_rel));
      });

      const views = [
        ["元2D画像", item.orig_rel ? "./" + encodeURI(item.orig_rel) : null],
        ["3Dカラー", item.render_rel ? "./" + encodeURI(item.render_rel) : null],
        ["クレイ形状", item.clay_rel ? "./" + encodeURI(item.clay_rel) : null],
      ].filter((x) => Boolean(x[1]));
      if (views.length) {
        const strip = document.createElement("div");
        strip.className = "modal-thumbs";
        for (const [label, url] of views) {
          const a = document.createElement("a");
          a.href = url;
          a.target = "_blank";
          const img = document.createElement("img");
          img.src = url;
          img.alt = label;
          const cap = document.createElement("div");
          cap.textContent = label;
          a.appendChild(img);
          a.appendChild(cap);
          strip.appendChild(a);
        }
        leftCol.appendChild(strip);
      }

      const info = document.createElement("div");
      info.className = "modal-info";
      const h2 = document.createElement("h2");
      h2.textContent = item.id;
      info.appendChild(h2);

      const tags = document.createElement("div");
      tags.className = "meta-tags";
      for (const t of [
        item.category_label,
        item.subcategory,
        ...(item.attrs || []),
        item.rigged ? `ボーン入 (${item.rig_method || "rig"})` : "単体メッシュ",
        item.height_m ? `${item.height_m}m` : "",
      ]) {
        if (!t) continue;
        const s = document.createElement("span");
        s.className = "tag";
        s.textContent = t;
        tags.appendChild(s);
      }
      info.appendChild(tags);

      const tierInfo = (notices.tiers || {})[item.license_tier] || {};
      const licBox = document.createElement("div");
      licBox.className = "modal-prompt";
      licBox.style.borderColor = item.license_tier === "noncommercial_research" ? "#f5a623" : "#5b8cff";
      licBox.textContent = `【ライセンス区分】${tierInfo.label || item.license_label || ""}\n${tierInfo.detail || ""}`;
      info.appendChild(licBox);

      if (item.prompt) {
        const p = document.createElement("div");
        p.className = "modal-prompt";
        p.textContent = item.prompt;
        info.appendChild(p);
      }

      const q = item.qa || {};
      const h = q.health || {};
      const kv = document.createElement("div");
      kv.className = "kv-grid";
      const rows = [
        ["三角面数", h.triangles ? h.triangles.toLocaleString() : "-"],
        ["GLB容量", fmtSize(item.glb_size)],
        ["軽量LOD 4k", item.lod_size ? fmtSize(item.lod_size) : "-"],
        ["採用日時", item.published_at || "-"],
      ];
      for (const [k, v] of rows) {
        const cell = document.createElement("div");
        cell.className = "kv-item";
        const dk = document.createElement("div");
        dk.className = "k";
        dk.textContent = k;
        const dv = document.createElement("div");
        dv.className = "v";
        dv.textContent = v;
        cell.appendChild(dk);
        cell.appendChild(dv);
        kv.appendChild(cell);
      }
      info.appendChild(kv);

      const acts = document.createElement("div");
      acts.style.cssText = "display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;";
      const dl = document.createElement("a");
      dl.className = "btn primary";
      dl.href = "./" + encodeURI(item.model_rel);
      dl.download = `${item.id}.glb`;
      dl.textContent = `GLB ダウンロード (${fmtSize(item.glb_size)})`;
      acts.appendChild(dl);

      if (item.lod_rel) {
        const lod = document.createElement("a");
        lod.className = "btn secondary";
        lod.href = "./" + encodeURI(item.lod_rel);
        lod.download = `${item.id}_lod4k.glb`;
        lod.textContent = `軽量LOD 4k (${fmtSize(item.lod_size)})`;
        acts.appendChild(lod);
      }

      const closeBtn = document.createElement("button");
      closeBtn.type = "button";
      closeBtn.className = "btn";
      closeBtn.textContent = "閉じる";
      closeBtn.addEventListener("click", () => dlg.close());
      acts.appendChild(closeBtn);
      info.appendChild(acts);

      body.appendChild(leftCol);
      body.appendChild(info);
      dlg.showModal();
    }

    function renderGrid() {
      const list = filteredItems();
      const pageSize = parseInt(document.getElementById("sel-pagesize").value, 10) || 120;
      const totalPages = Math.max(1, Math.ceil(list.length / pageSize));
      if (currentPage > totalPages) currentPage = totalPages;
      const start = (currentPage - 1) * pageSize;
      const pageItems = list.slice(start, start + pageSize);

      document.getElementById("match-count").textContent =
        `${list.length}件該当 (${start + (pageItems.length ? 1 : 0)}〜${start + pageItems.length}件を表示)`;
      document.getElementById("page-info").textContent = `${currentPage} / ${totalPages}`;
      document.getElementById("btn-prev").disabled = currentPage <= 1;
      document.getElementById("btn-next").disabled = currentPage >= totalPages;

      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      if (!pageItems.length) {
        const empty = document.createElement("div");
        empty.style.cssText = "grid-column:1/-1;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;color:var(--muted);";
        empty.textContent = "公開対象アセットがまだ登録されていません。";
        grid.appendChild(empty);
        return;
      }

      const frag = document.createDocumentFragment();
      for (const it of pageItems) {
        const card = document.createElement("article");
        card.className = "card";

        let imgRel = it.orig_rel;
        let isSq = faceZoom;
        if (viewBase === "render") { imgRel = it.render_rel || it.orig_rel; isSq = true; }
        else if (viewBase === "clay") { imgRel = it.clay_rel || it.orig_rel; isSq = true; }

        const wrap = document.createElement("div");
        wrap.className = "thumb-wrap" + (isSq ? " square" : "") + (faceZoom ? " face-zoom" : "");
        wrap.addEventListener("click", () => openDetail(it));

        if (imgRel) {
          const img = document.createElement("img");
          img.loading = "lazy";
          img.src = "./" + encodeURI(imgRel);
          img.alt = it.id;
          wrap.appendChild(img);
        } else {
          const ph = document.createElement("div");
          ph.className = "thumb-placeholder";
          ph.textContent = it.id;
          wrap.appendChild(ph);
        }

        const pill = document.createElement("span");
        pill.className = "status-pill";
        pill.textContent = (it.rigged ? "🦴 " : "") + "GLB " + fmtSize(it.glb_size);
        wrap.appendChild(pill);

        const licPill = document.createElement("span");
        licPill.className = `lic-pill lic-${it.license_tier || "ai_generated_restricted"}`;
        licPill.textContent = it.license_label || "原則非商用";
        wrap.appendChild(licPill);

        const ov = document.createElement("div");
        ov.className = "dl-overlay";
        ov.innerHTML = "<span>クリックで 3D / アニメ表示</span><span>🧊</span>";
        wrap.appendChild(ov);

        const body = document.createElement("div");
        body.className = "card-body";
        const title = document.createElement("div");
        title.className = "card-title";
        title.textContent = it.id;
        body.appendChild(title);

        const tags = document.createElement("div");
        tags.className = "meta-tags";
        for (const t of [it.category_label, it.subcategory, ...(it.attrs || []), it.height_m ? `${it.height_m}m` : ""]) {
          if (!t) continue;
          const sp = document.createElement("span");
          sp.className = "tag";
          sp.textContent = t;
          tags.appendChild(sp);
        }
        body.appendChild(tags);

        const acts = document.createElement("div");
        acts.className = "card-actions";
        const vBtn = document.createElement("button");
        vBtn.type = "button";
        vBtn.className = "btn";
        vBtn.textContent = "3D表示";
        vBtn.addEventListener("click", () => openDetail(it));
        acts.appendChild(vBtn);

        const dl = document.createElement("a");
        dl.className = "btn primary";
        dl.href = "./" + encodeURI(it.model_rel);
        dl.download = `${it.id}.glb`;
        dl.textContent = "GLB";
        acts.appendChild(dl);
        body.appendChild(acts);

        card.appendChild(wrap);
        card.appendChild(body);
        frag.appendChild(card);
      }
      grid.appendChild(frag);
    }

    async function init() {
      const [cRes, nRes] = await Promise.all([
        fetch("./catalog.json", { cache: "no-store" }),
        fetch("./notices.json", { cache: "no-store" }),
      ]);
      catalog = await cRes.json();
      notices = await nRes.json();
      const title = `${catalog.repo_name || "modelAssets"} — ${catalog.repo_label || "公開ギャラリー"}`;
      document.title = title;
      document.getElementById("site-title").textContent = title;
      const st = catalog.stats || {};
      document.getElementById("stat-summary").innerHTML =
        `公開 <strong>${st.total || 0}</strong>体 / ボーン入 <strong>${st.rigged || 0}</strong>体 / GLB合計 <strong>${fmtSize(st.glb_bytes || 0)}</strong>`;
      renderRepoNav();
      renderFilters();
      renderGrid();
    }

    document.getElementById("btn-notices").addEventListener("click", openNoticesModal);
    document.getElementById("btn-notices-banner").addEventListener("click", openNoticesModal);
    document.querySelectorAll("#vmode-group [data-vmode]").forEach((b) => {
      b.addEventListener("click", () => {
        viewBase = b.dataset.vmode;
        document.querySelectorAll("#vmode-group [data-vmode]").forEach((x) => x.classList.remove("active"));
        b.classList.add("active");
        renderGrid();
      });
    });
    document.getElementById("btn-face-toggle").addEventListener("click", (e) => {
      faceZoom = !faceZoom;
      e.currentTarget.classList.toggle("active", faceZoom);
      renderGrid();
    });
    document.getElementById("btn-reset").addEventListener("click", () => {
      selectedCategory = "all";
      selectedSub.clear();
      selectedAttr.clear();
      document.getElementById("inp-search").value = "";
      document.getElementById("sel-sort").value = "newest";
      currentPage = 1;
      renderFilters();
      renderGrid();
    });
    for (const id of ["sel-sort", "sel-pagesize"]) {
      document.getElementById(id).addEventListener("change", () => { currentPage = 1; renderGrid(); });
    }
    document.getElementById("inp-search").addEventListener("input", () => { currentPage = 1; renderGrid(); });
    document.getElementById("btn-prev").addEventListener("click", () => { if (currentPage > 1) { currentPage--; renderGrid(); window.scrollTo(0, 0); } });
    document.getElementById("btn-next").addEventListener("click", () => { currentPage++; renderGrid(); window.scrollTo(0, 0); });
    document.getElementById("detail-dialog").addEventListener("click", (e) => { if (e.target === e.currentTarget) e.currentTarget.close(); });
    document.getElementById("detail-dialog").addEventListener("close", () => { if (window.unmountGlbViewer) window.unmountGlbViewer(); });
    document.getElementById("notices-dialog").addEventListener("click", (e) => { if (e.target === e.currentTarget) e.currentTarget.close(); });

    init();
  </script>
</body>
</html>
